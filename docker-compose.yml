services:
  db:
    image: postgres:16-alpine
    container_name: baraa-raed-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baraa_raed}
      POSTGRES_USER: ${POSTGRES_USER:-baraa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baraa_dev_secret}
    volumes:
      - baraa_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baraa} -d ${POSTGRES_DB:-baraa_raed}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: baraa-raed-api
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api,0.0.0.0
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  app:
    build: .
    container_name: baraa-raed-app
    restart: unless-stopped
    env_file:
      - production.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - baraa_raed_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  baraa_postgres_data:
  baraa_raed_data:
