services:
  app:
    build: .
    container_name: baraa-raed-app
    restart: unless-stopped
    env_file:
      - production.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - baraa_raed_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  baraa_raed_data:
